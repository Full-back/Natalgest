    <radialGradient id="glowGreen" cx="70%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#2E5D57" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#2E5D57" stop-opacity="0"/>
