<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <!-- Gradient background - Warm welcoming tones -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DCE8E6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F3E1E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FBF0ED;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="softCircle1" cx="20%" cy="30%">
      <stop offset="0%" style="stop-color:#E8F4F1;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#DCE8E6;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Base gradient -->
  <rect width="1920" height="1080" fill="url(#grad1)"/>
  
  <!-- Soft decorative circles -->
  <circle cx="1700" cy="150" r="400" fill="url(#softCircle1)"/>
  <circle cx="200" cy="900" r="350" fill="url(#softCircle1)"/>
  
  <!-- Decorative maternal elements - Abstract hearts and wellness symbolism -->
  <g opacity="0.15">
    <!-- Large heart shape -->
    <path d="M 960 400 C 960 350, 900 300, 840 300 C 780 300, 750 350, 750 400 C 750 500, 960 650, 960 650 C 960 650, 1170 500, 1170 400 C 1170 350, 1140 300, 1080 300 C 1020 300, 960 350, 960 400" fill="#B5697A"/>
  </g>
  
  <!-- Welcoming message area -->
  <g opacity="0.8">
    <text x="960" y="300" font-family="Fraunces, serif" font-size="64" font-weight="700" fill="#2E5D57" text-anchor="middle">
      Bienvenue
    </text>
    <text x="960" y="400" font-family="Inter, sans-serif" font-size="24" fill="#5F7D5B" text-anchor="middle">
      Commençons un nouveau parcours ensemble
    </text>
  </g>
  
  <!-- Soft organic shapes -->
  <ellipse cx="300" cy="200" rx="150" ry="100" fill="#2E5D57" opacity="0.08"/>
  <ellipse cx="1620" cy="950" rx="200" ry="120" fill="#B5697A" opacity="0.08"/>
</svg>